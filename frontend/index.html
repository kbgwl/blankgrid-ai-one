<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>空白格 · AI 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='none' stroke='%2375d8ce' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2375d8ce'/%3E%3C/svg%3E" />
  <script>
    /* 主题在首帧之前就定下来,加载页不会先闪一下墨色 */
    (function () {
      var t = 'ink'
      try { t = localStorage.getItem('bg-theme') || 'ink' } catch (e) { /* 读不到就用默认 */ }
      document.documentElement.dataset.theme = t
    })()
  </script>
  <style>
    /* 加载页:画布中央一枚空格渐亮 */
    :root {
      --boot-bg: #0b0d12; --boot-fg: #f5f6f4; --boot-ac: #75d8ce;
      --boot-dim: rgba(245, 246, 244, .35);
    }
    :root[data-theme="paper"] {
      --boot-bg: #e9e2d3; --boot-fg: #1c1b17; --boot-ac: #a5462f;
      --boot-dim: rgba(28, 27, 23, .42);
    }
    html, body { margin: 0; height: 100%; background: var(--boot-bg); }
    #boot {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--boot-bg); color: var(--boot-fg);
      font-family: "HarmonyOS Sans", "MiSans", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: opacity .8s ease; letter-spacing: .35em;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .cell {
      width: 72px; height: 72px; border: 1.5px solid color-mix(in srgb, var(--boot-ac) 50%, transparent);
      border-radius: 18px; position: relative; margin-bottom: 34px;
      animation: cellGlow 3s ease-in-out infinite;
    }
    #boot .cell::after {
      content: ""; position: absolute; inset: 26px; border-radius: 50%;
      background: var(--boot-ac); filter: blur(2px);
      animation: dotBreath 3s ease-in-out infinite;
    }
    #boot .name { font-size: 28px; font-weight: 300; letter-spacing: .5em; margin-left: .5em; }
    #boot .en { font-size: 11px; letter-spacing: .6em; color: var(--boot-dim); margin-top: 14px; margin-left: .6em; }
    #boot .corp { font-size: 11px; letter-spacing: .3em; color: var(--boot-dim); margin-top: 40px; margin-left: .3em; }
    @keyframes cellGlow {
      0%, 100% { box-shadow: 0 0 0 color-mix(in srgb, var(--boot-ac) 0%, transparent); border-color: color-mix(in srgb, var(--boot-ac) 40%, transparent); }
      50% { box-shadow: 0 0 42px color-mix(in srgb, var(--boot-ac) 18%, transparent); border-color: color-mix(in srgb, var(--boot-ac) 85%, transparent); }
    }
    @keyframes dotBreath {
      0%, 100% { opacity: .35; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <div class="cell"></div>
    <div class="name">空白格</div>
    <div class="en">BLANKGRID · AI CONSOLE</div>
    <div class="corp">无锡空白格人工智能科技有限公司</div>
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const b = document.getElementById('boot');
        if (b) { b.classList.add('hide'); setTimeout(() => b.remove(), 900); }
      }, 1400);
    });
  </script>
</body>
</html>
