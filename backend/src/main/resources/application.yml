server:
  port: 8090

spring:
  application:
    name: aione
  datasource:
    url: jdbc:h2:file:./data/aione;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

aione:
  data-dir: ./data
